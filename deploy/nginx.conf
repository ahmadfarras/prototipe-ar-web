# Inside the web container. The host's nginx is the only client: it arrives
# from a private Docker address and passes the visitor's address in X-Real-IP.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/security-headers.conf;

    location /api/ {
        # A variable makes nginx look the API up again after it is redeployed.
        resolver 127.0.0.11 valid=10s;
        set $api http://api:3000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # The API sets this one itself.
        proxy_hide_header X-Content-Type-Options;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ ^/targets/[^/]+\.mind$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # AR Quick Look needs this type; nginx's mime.types does not know .usdz.
    location ~ ^/models/[^/]+\.usdz$ {
        types { }
        default_type model/vnd.usdz+zip;
    }

    location = /targets/targets.manifest.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # So a new deploy is picked up without clearing the browser cache.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Deep links such as /scan are routes of the single-page app.
    location / {
        try_files $uri /index.html;
    }
}
